services:
  db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    # ports: ["5432:5432"] - exposed host
    volumes:
      - relay-pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://relay:relay@db:5432/relay}
      MIGRATIONS_DIR: /migrations
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://relay:relay@db:5432/relay}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_MAX_TENANTS: ${METRICS_MAX_TENANTS:-100}
      METRICS_FAILURE_WINDOW_MINUTES: ${METRICS_FAILURE_WINDOW_MINUTES:-60}
      PYTHONUNBUFFERED: "1"
    ports: ["8000:8000"]
    restart: on-failure
    volumes:
      - ./api:/app
      - ./shared:/app/shared
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://relay:relay@db:5432/relay}
      LEASE_SECONDS: ${LEASE_SECONDS:-30}
      PYTHONUNBUFFERED: "1"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/worker-heartbeat) )) -lt 30"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  web:
    build: ./web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["5173:5173"]
    depends_on:
      api:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://relay:relay@db:5432/relay}
      API_URL: http://api:8000
      PYTHONUNBUFFERED: "1"
      # Lets the suite drive the worker's lease renewal directly, against the
      # real database, instead of inferring it from timing.
      PYTHONPATH: /src:/src/worker
    volumes:
      - ./tests:/tests
      - ./worker:/src/worker:ro
      - ./shared:/src/shared:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  relay-pgdata:
